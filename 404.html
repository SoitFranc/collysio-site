<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Porte introuvable — Collysio</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0e1033" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid; place-items: center; padding: 16px; box-sizing: border-box;
      background: radial-gradient(ellipse at 50% 28%, #2d2466 0%, #0d0e2b 68%); color: #fff6e3;
      font: 700 16px/1.5 Nunito, system-ui, sans-serif; text-align: center;
    }
    .carte { max-width: 440px; padding: 28px 24px; border-radius: 18px; background: #1c130b; border: 4px solid #2a1a0c; box-shadow: inset 0 0 0 3px #b8863b, 0 20px 60px rgba(0,0,0,.5); }
    img { width: 96px; height: 96px; }
    h1 { margin: 8px 0 8px; font: 900 26px Cinzel, Georgia, serif; color: #ffc83d; letter-spacing: 1px; }
    p { margin: 0 0 18px; color: #f3e2c0; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 8px 20px; font: 20px "Lilita One", Nunito, sans-serif; color: #0e1033; background: #ffc83d; border: 4px solid #000; border-radius: 16px; box-shadow: 0 5px 0 #000; text-decoration: none; }
    small { display: block; margin-top: 16px; color: #d9c7a3; font-weight: 700; }
  </style>
</head>
<body>
  <main class="carte">
    <img src="/favicon.svg" alt="" />
    <h1>Porte introuvable</h1>
    <p>Cette porte n'existe pas, ou pas encore. Le hall, lui, est toujours ouvert.</p>
    <a href="/">Retour au hall</a>
    <small id="compte">Retour automatique dans quelques secondes…</small>
  </main>
  <script>
    // Ancienne adresse d'un jeu écrite autrement (majuscules, sans barre finale) : on y va directement.
    (function () {
      var jeux = ["echecs", "dedale", "honneur", "chars", "titans"];
      var premier = location.pathname.split("/")[1] || "";
      var nom = premier.toLowerCase().normalize ? premier.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "") : premier.toLowerCase();
      if (jeux.indexOf(nom) >= 0 && premier !== nom) return location.replace("/" + nom + "/" + location.search);
      setTimeout(function () { location.replace("/"); }, 6000);
    })();
  </script>
</body>
</html>
