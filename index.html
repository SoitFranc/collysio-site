<body>
  <canvas id="scene"></canvas>
  <div id="labels"></div>

  <div class="hud hud-left">
    <button class="chip" id="profile" type="button" aria-label="Personnaliser ton avatar">
      <span class="chip-dot" id="profile-dot"></span>
      <b class="chip-warn" id="profile-warn" hidden title="Profil non sauvegardé">!</b>
      <span>
        <strong id="profile-name">Gladiateur</strong>
        <small id="profile-sub">Saison 1 · Personnaliser</small>
      </span>
    </button>
    <button class="chip prog" id="prog" type="button" hidden aria-label="Niveau et quêtes du jour">
      <strong id="prog-level">Niv. 1</strong>
      <span class="prog-bar"><i id="prog-fill"></i><small id="prog-xp"></small></span>
      <span id="prog-streak">Quêtes</span>
      <b id="prog-dot" hidden>1</b>
    </button>
    <div class="quests" id="quests" hidden></div>
  </div>

  <div class="hud hud-right">
    <span class="chip"><span class="live" id="live-dot"></span><span id="online">Connexion à l'Olympe…</span></span>
    <button class="chip" id="social" type="button" title="Amis et messages" aria-label="Amis et messages" hidden>✉ <span class="badge" id="social-n" hidden>0</span></button>
    <button class="chip drachmes" id="drachmes" type="button" title="Tes drachmes · VAULT" hidden><span class="coin-ic">Δ</span><span id="drachmes-n">0</span></button>
    <button class="btn-gold" id="wallet" type="button">Connecter un wallet</button>
  </div>

  <div class="prompt" id="prompt" hidden></div>
  <p class="help">ZQSD / WASD ou clic pour te déplacer · Espace pour sauter · glisser pour tourner · Entrée pour parler</p>

  <form class="chat" id="chat" hidden>
    <label for="chat-input" class="sr">Message</label>
    <input id="chat-input" maxlength="80" autocomplete="off" placeholder="Dis quelque chose au hall…" />
  </form>

  <dialog id="door-dialog">
    <h2 id="door-title"></h2>
    <p id="door-text"></p>
    <div class="row">
      <button type="button" class="btn-ghost" id="door-close">Retour au hall</button>
      <a class="btn-gold" id="door-enter" href="echecs/" hidden>Entrer dans l'arène</a>
    </div>
  </dialog>

  <dialog id="avatar-dialog">
    <section class="account" id="account" aria-label="Mon compte"></section>
    <div id="avatar-edit">
      <h2>Ton avatar</h2>
      <div class="avatar-top">
        <div class="avatar-preview" id="avatar-preview" aria-label="Aperçu de ton personnage"></div>
        <div class="avatar-fields">
          <label class="field">Pseudo <input id="name-input" maxlength="20" /></label>
          <p class="field-label">Tête</p>
          <div class="helmets" id="heads"></div>
        </div>
      </div>
      <p class="field-label">Tenue</p>
      <div class="helmets" id="helmets"></div>
      <p class="field-label">Livrée <small>une teinture de la tenue</small></p>
      <div class="helmets liveries" id="liveries"></div>
      <p class="field-label">Cape</p>
      <div class="swatches" id="tunics"></div>
      <button type="button" class="btn-ghost collection-link" id="avatar-collection">Ma collection : bras, jambes, armes, titres, familles →</button>
      <div class="row"><button type="button" class="btn-ghost" id="avatar-close">Fermer</button><button type="button" class="btn-gold" id="avatar-save">Valider</button></div>
    </div>
  </dialog>

</body>
</html>
